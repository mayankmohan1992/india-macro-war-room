name: CI

# Runs on every push and pull request. The point is to prove two things on a clean machine:
#   1. the pipeline reproduces the committed data from the committed source tables, and
#   2. the dashboard really renders (headless Chromium assertions) and the published API is valid.
# Nothing here needs a secret: the DBIE client only uses a public constant, and CI never fetches.

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read        # jobs below request only what they actually need

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build from committed data, verify dashboard and API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Run the unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify the numbers against the RBI source tables
        run: python tools/verify_provenance.py

      - name: Rebuild the dataset from the committed raw tables
        run: |
          python build_dashboard.py
          echo "--- reproducibility: the rebuild must match what is committed ---"
          python publish_api.py --out /tmp/api_rebuild
          python - <<'PY'
          import json, pathlib, sys
          new = json.load(open("/tmp/api_rebuild/status.json"))["dataset_sha256"]
          old = json.load(open("api/v1/status.json"))["dataset_sha256"]
          print("committed:", old)
          print("rebuilt  :", new)
          if new != old:
              sys.exit("FAIL: the committed API is not reproducible from the committed raw data - "
                       "re-run the pipeline locally and commit the result")
          print("PASS: committed API reproduces exactly from the committed raw tables")
          PY

      - name: Verify the rendered dashboard
        run: |
          python -m playwright install --with-deps chromium
          python verify_dashboard.py

      - name: Generate a note from the committed API (does not touch notes/)
        run: |
          python tools/weekly_note.py --out /tmp/notecheck --card --date 2026-11-13
          python - <<'PY'
          import pathlib, re, sys
          md = pathlib.Path("/tmp/notecheck/2026-W46.md").read_text()
          items = re.findall(r"^\d\. \*\*", md, re.M)
          assert len(items) == 6, f"expected 6 numbers, got {len(items)}\n{md}"
          assert "dataset_sha256" in md, "the note must carry the dataset hash it was built from"
          # the note's own disclaimer says "not forecast", so only forward-looking *claims* are banned
          for banned in ("is expected to", "will rise", "will fall", "likely to", "should push"):
              assert banned not in md.lower(), f"the note must not forecast (found {banned!r})"
          print("note ok:", len(md.split()), "words,", len(items), "numbers")
          PY

      - name: Validate the published API
        run: python tools/validate_api.py

      - name: Reproducibility check - the committed dashboard must match the rebuild
        run: |
          python - <<'PY'
          import pathlib, re, subprocess, sys
          committed = subprocess.run(["git", "show", "HEAD:dashboard/index.html"],
                                     capture_output=True, text=True, check=True).stdout
          built = pathlib.Path("dashboard/index.html").read_text()
          # The build stamp is the only field allowed to differ between two identical builds.
          norm = lambda s: re.sub(r'"generated": "[^"]*"', '"generated": ""', s)
          if norm(committed) != norm(built):
              a, b = norm(committed), norm(built)
              same = sum(1 for x, y in zip(a, b) if x == y)
              sys.exit("FAIL: the committed dashboard does not reproduce from the committed raw "
                       f"data (first difference near char {same}; committed {len(a)} vs rebuilt "
                       f"{len(b)} chars) - re-run build_dashboard.py and commit the result")
          print("PASS: the committed dashboard reproduces byte-for-byte (build stamp aside)")
          PY

      - name: Check the Pages artifact assembles
        run: |
          bash scripts/build-public.sh
          test -f public/index.html
          test -f public/api/v1/latest.json
          test -f public/embed.js
          test -f public/embed.html
          # the demo must not load any third-party script or stylesheet
          python -c "import re,pathlib; h=pathlib.Path('embed/demo.html').read_text(); ext=[u for u in re.findall(r'src=\"([^\"]+)\"', h) if u.startswith('http') and 'mayankmohan1992.github.io' not in u]; assert not ext, ext; print('demo.html: no third-party src')"
          python -c "import re,pathlib; s=pathlib.Path('public/embed.js').read_text(); assert 'data-imwr-series' in s and 'api/v1/' in s; print('embed.js ok', len(s), 'bytes')"

      - name: Validate the workflows themselves
        # PyYAML silently keeps the LAST value of a duplicate key and reports success; GitHub reads the
        # same file as invalid and refuses to run it (a step header lost in an edit put two `run:` keys
        # in one step, and only the Actions parser noticed). So duplicates are checked here by hand.
        run: |
          python - <<'PY'
          import pathlib, sys, yaml

          class Strict(yaml.SafeLoader):
              pass

          def no_duplicates(loader, node, deep=False):
              seen = set()
              for key_node, _ in node.value:
                  key = loader.construct_object(key_node, deep=deep)
                  if key in seen:
                      raise yaml.YAMLError(f"duplicate key {key!r} at line {key_node.start_mark.line + 1}")
                  seen.add(key)
              return yaml.SafeLoader.construct_mapping(loader, node, deep)

          Strict.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, no_duplicates)
          bad = 0
          for p in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              try:
                  yaml.load(p.read_text(), Loader=Strict)     # noqa: S506 - local repo files
                  print("ok:", p)
              except yaml.YAMLError as exc:
                  bad += 1
                  print(f"INVALID: {p}: {exc}")
          sys.exit(1 if bad else 0)
          PY

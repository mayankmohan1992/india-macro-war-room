name: CI

# Runs on every push and pull request. The point is to prove two things on a clean machine:
#   1. the pipeline reproduces the committed data from the committed source tables, and
#   2. the dashboard really renders (headless Chromium assertions) and the published API is valid.
# Nothing here needs a secret: the DBIE client only uses a public constant, and CI never fetches.

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read        # jobs below request only what they actually need

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build from committed data, verify dashboard and API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Rebuild the dataset from the committed raw tables
        run: |
          python build_dashboard.py
          echo "--- reproducibility: the rebuild must match what is committed ---"
          python publish_api.py --out /tmp/api_rebuild
          python - <<'PY'
          import json, pathlib, sys
          new = json.load(open("/tmp/api_rebuild/status.json"))["dataset_sha256"]
          old = json.load(open("api/v1/status.json"))["dataset_sha256"]
          print("committed:", old)
          print("rebuilt  :", new)
          if new != old:
              sys.exit("FAIL: the committed API is not reproducible from the committed raw data - "
                       "re-run the pipeline locally and commit the result")
          print("PASS: committed API reproduces exactly from the committed raw tables")
          PY

      - name: Verify the rendered dashboard
        run: |
          python -m playwright install --with-deps chromium
          python verify_dashboard.py

      - name: Validate the published API
        run: python tools/validate_api.py

      - name: Reproducibility check - the committed dashboard must match the rebuild
        run: |
          python - <<'PY'
          import pathlib, re, subprocess, sys
          committed = subprocess.run(["git", "show", "HEAD:dashboard/index.html"],
                                     capture_output=True, text=True, check=True).stdout
          built = pathlib.Path("dashboard/index.html").read_text()
          # The build stamp is the only field allowed to differ between two identical builds.
          norm = lambda s: re.sub(r'"generated": "[^"]*"', '"generated": ""', s)
          if norm(committed) != norm(built):
              a, b = norm(committed), norm(built)
              same = sum(1 for x, y in zip(a, b) if x == y)
              sys.exit("FAIL: the committed dashboard does not reproduce from the committed raw "
                       f"data (first difference near char {same}; committed {len(a)} vs rebuilt "
                       f"{len(b)} chars) - re-run build_dashboard.py and commit the result")
          print("PASS: the committed dashboard reproduces byte-for-byte (build stamp aside)")
          PY

      - name: Check the Pages artifact assembles
        run: bash scripts/build-public.sh && test -f public/index.html && test -f public/api/v1/latest.json

      - name: Validate the workflows themselves
        run: |
          python -c "
          import sys, yaml, pathlib
          for p in pathlib.Path('.github/workflows').glob('*.yml'):
              yaml.safe_load(p.read_text()); print('ok:', p)"

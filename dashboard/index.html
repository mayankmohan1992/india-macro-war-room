    --c-grid:#e4e3df; --c-axis:#c9c7c0; --c-zero:#b4b2ab; --c-cross:#9a9891;
    --c-band:rgba(31,157,85,.10); --c-pos:rgba(31,157,85,.55); --c-neg:rgba(232,87,63,.55);
    --sans:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
    --rail:clamp(320px,25vw,412px);
  }
  /* dark variant — same tokens, switched by [data-theme="dark"] on <html> (set by the head script
     from the stored choice or the OS preference, and by the Light/Dark toggle in the header) */
  :root[data-theme="dark"]{
      --paper:#121316; --raised:#101014; --sunken:#060607; --ink:#f2f1ee; --ink2:#a8a6a0; --ink3:#7a7973;
      --line:rgba(242,241,238,.17); --line2:rgba(242,241,238,.40);
      --accent:#74aaff; --accent-ink:#a9c9ff;
      --good:#4cd58a; --watch:#ffc14d; --bad:#ff8a70;
      --good-soft:rgba(76,213,138,.10); --watch-soft:rgba(255,193,77,.11); --bad-soft:rgba(255,138,112,.10);
      --c-accent:#74aaff; --c-accent2:#b69cff; --c-teal:#52d1ea; --c-pink:#ff7ab8;
      --c-grid:#24252a; --c-axis:#33353c; --c-zero:#3f4148; --c-cross:#6a6c73;
      --c-band:rgba(76,213,138,.11); --c-pos:rgba(76,213,138,.55); --c-neg:rgba(255,138,112,.55);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.42;
    -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  body.modal-open{overflow:hidden}
  button{font-family:inherit;color:inherit}
  h1,h2,h3{margin:0;letter-spacing:-.02em;font-weight:600}
  .micro{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:600}

  /* ---------------- app shell: fixed viewport, two independently scrolling panes ---------------- */
  body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
  header.bar{flex:none;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    padding:11px 16px;border-bottom:1px solid var(--line);background:var(--paper);z-index:30}
  .brand{display:flex;align-items:baseline;gap:10px;min-width:0}
  .brand h1{font-size:15px;white-space:nowrap}
  .brand .meta{font-size:11px;color:var(--ink3);white-space:nowrap}
  .brand .meta b{color:var(--ink2);font-weight:600}
  .vd{display:flex;align-items:center;gap:7px;padding:0 12px;border-left:1px solid var(--line)}
  .vd i{width:8px;height:8px;background:var(--ink3);flex:none}
  .vd b{font-size:12.5px;font-weight:600}
  .counts{display:flex;gap:14px;font-size:11.5px;color:var(--ink2)}
  .counts span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .counts i{width:8px;height:8px;flex:none}
  .controls{margin-left:auto;display:flex;align-items:center;gap:8px}
  .seg{display:flex;border:1px solid var(--line);background:var(--raised)}
  .seg button{border:0;background:transparent;padding:5px 10px;font-size:10.5px;letter-spacing:.1em;
    text-transform:uppercase;font-weight:600;color:var(--ink3);cursor:pointer}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--ink);color:var(--paper)}
  .seg button:hover:not(.on){color:var(--accent)}
  .burger{display:none;border:1px solid var(--line);background:var(--raised);width:34px;height:30px;
    cursor:pointer;font-size:14px;line-height:1}
  .backdrop{position:fixed;inset:0;background:rgba(16,16,20,.42);z-index:35}
  .backdrop[hidden]{display:none}

  main.shell{flex:1;min-height:0;display:grid;grid-template-columns:var(--rail) minmax(0,1fr)}
  aside.rail{min-height:0;overflow-y:auto;overscroll-behavior:contain;border-right:1px solid var(--line);
    padding:12px 12px 40px;background:var(--raised)}
  section.panes{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 14px 60px}
  .rail-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 9px}
  .rail-head .hint{font-size:10.5px;color:var(--ink3)}
  .sec{display:flex;align-items:baseline;gap:8px;grid-column:1/-1;margin:14px 0 7px;
    padding-bottom:5px;border-bottom:1px solid var(--line)}
  .sec:first-of-type{margin-top:0}
  .sec .no{font-family:var(--mono);font-size:10px;color:var(--ink3)}
  .sec h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);font-weight:600}
  .sec .note{margin-left:auto;font-size:10.5px;color:var(--ink3);text-align:right}

  /* ---------------- tiles: compact cards, 2 per row, every row full ---------------- */
  .tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .tile{position:relative;background:var(--paper);border:1px solid var(--line);padding:8px 9px 7px;
    display:flex;flex-direction:column;gap:5px;min-width:0}
  .tile .edge{position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--ink3)}
  .tile.good .edge{background:var(--good)} .tile.watch .edge{background:var(--watch)} .tile.bad .edge{background:var(--bad)}
  .tile.good{background:linear-gradient(90deg,var(--good-soft),transparent 42%)}
  .tile.bad{background:linear-gradient(90deg,var(--bad-soft),transparent 42%)}
  .t-head{display:flex;align-items:flex-start;gap:6px}
  .t-label{font-size:10.5px;line-height:1.25;color:var(--ink2);flex:1;min-width:0}
  .t-body{display:flex;align-items:flex-end;justify-content:space-between;gap:6px}
  .t-val{font-size:23px;font-weight:300;letter-spacing:-.03em;line-height:1;white-space:nowrap}
  .t-val small{font-size:11px;font-weight:400;color:var(--ink3);margin-left:2px}
  .t-val.wide{font-size:19px}
  .t-side{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
  .t-delta{font-family:var(--mono);font-size:10px;padding:1px 4px;border:1px solid var(--line);color:var(--ink2)}
  .t-delta.stale{border-style:dashed;color:var(--watch);cursor:help}
  .up{color:var(--good)} .down{color:var(--bad)}
  .t-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:9.5px;
    color:var(--ink3);font-family:var(--mono)}
  .st-g{color:var(--good);font-weight:600} .st-w{color:var(--watch);font-weight:600} .st-b{color:var(--bad);font-weight:600}
  .spark{display:block}

  /* ---------------- charts: 2 columns, sectioned ---------------- */
  .charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card{background:var(--raised);border:1px solid var(--line);padding:10px 11px 8px;position:relative;
    cursor:zoom-in;display:flex;flex-direction:column;min-width:0}
  .card:hover{border-color:var(--line2)}
  .card:focus-visible,.chartwrap:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .card.wide{grid-column:1/-1}
  .chart-head{display:flex;align-items:flex-start;gap:8px}
  .chart-head .hgroup{min-width:0;flex:1}
  .chart-head h3{font-size:12.5px;line-height:1.25}
  .chart-head .cap{margin:2px 0 0;font-size:10px;color:var(--ink3);font-family:var(--mono);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .head-tools{display:flex;align-items:center;gap:5px;flex:none}
  .expand{border:1px solid var(--line);background:var(--paper);color:var(--ink3);font-size:9.5px;
    letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding:3px 7px;cursor:pointer}
  .card:hover .expand,.expand:hover,.expand:focus{border-color:var(--accent);color:var(--accent)}
  .help{width:17px;height:17px;border:1px solid var(--line);background:var(--paper);color:var(--ink3);
    font:600 10px/1 var(--mono);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
  .help:hover,.help:focus{border-color:var(--accent);color:var(--accent)}
  .tile .help{flex:none;margin-top:-1px}
  .histbtn{width:17px;height:17px;border:1px solid var(--line);background:var(--paper);color:var(--ink3);
    font:600 10px/1 var(--mono);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
    padding:0;flex:none;margin-top:-1px}
  .histbtn:hover,.histbtn:focus{border-color:var(--accent);color:var(--accent)}
  .tile{cursor:pointer}
  .tile:hover{border-color:var(--line2)}
  .tile:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .hist-body{padding:2px 16px 16px;overflow:auto}
  .hist-sum{border-left:2px solid var(--accent);background:var(--raised);padding:8px 11px;margin:8px 0 12px;
    font-size:12.5px;color:var(--ink2)}
  .hist-sum b{color:var(--ink);font-weight:600}
  table.hist{width:100%;border-collapse:collapse;font-size:12px}
  table.hist th,table.hist td{text-align:right;padding:6px 9px;border-bottom:1px solid var(--line)}
  table.hist th{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:600}
  table.hist th:first-child,table.hist td:first-child{text-align:left}
  table.hist td.d{color:var(--ink2);font-family:var(--mono);font-size:11px;text-align:left}
  table.hist td.v{font-weight:600}
  table.hist td.c{font-family:var(--mono);font-size:11px}
  table.hist tr.now td{background:var(--sunken)}
  table.hist tr.now td.v{color:var(--accent-ink)}
  .hist-note{margin-top:10px;font-size:11px;color:var(--ink3);font-family:var(--mono)}
  .modal-panel.hist{width:min(720px,96vw);max-height:86vh}
  .chartwrap{position:relative;margin-top:6px}
  svg{display:block;width:100%;height:auto}
  .legend{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:10px;color:var(--ink2);
    margin-top:6px;padding-top:5px;border-top:1px solid var(--line)}
  .legend i{display:inline-block;width:9px;height:9px;margin-right:4px;vertical-align:-1px}
  .legend .hint{margin-left:auto;color:var(--ink3);font-family:var(--mono);white-space:nowrap}
  .tip{position:absolute;top:4px;z-index:5;pointer-events:none;background:var(--ink);color:var(--paper);
    padding:5px 7px;font-family:var(--mono);font-size:10.5px;white-space:nowrap;display:none;
    box-shadow:0 6px 18px rgba(16,16,20,.24)}
  .tip .d{opacity:.68;font-size:9.5px;margin-bottom:3px}
  .tip .r{display:flex;align-items:center;gap:6px;line-height:1.5}
  .tip .r i{width:8px;height:8px;display:inline-block;flex:none}
  .tip .r b{margin-left:auto;font-weight:600}
  .tip .r span{opacity:.72}
  .warnbar{border:1px solid var(--line);border-left:2px solid var(--watch);background:var(--raised);
    padding:8px 11px;font-size:11.5px;color:var(--ink2);margin-bottom:12px}
  .warnbar b{color:var(--ink)}
  /* 10 chips: 5x2 on desktop, 2x5 on narrow — both divide 10, so no row is ever short */
  .strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
  .kv{border:1px solid var(--line);background:var(--raised);padding:7px 9px}
  .kv .k{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:600}
  .kv .v{font-size:16px;font-weight:300;margin-top:2px;letter-spacing:-.02em}
  .kv .d{font-size:9.5px;color:var(--ink3);font-family:var(--mono)}
  table.rules{width:100%;border-collapse:collapse;font-size:11.5px}
  table.rules th,table.rules td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  table.rules th{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
  table.rules td.mono{font-family:var(--mono);color:var(--ink2);font-size:11px}
  footer.foot{grid-column:1/-1;border-top:1px solid var(--line);margin-top:18px;padding-top:10px;
    color:var(--ink3);font-size:10.5px;font-family:var(--mono);line-height:1.6}

  /* ---------------- modals (chart + definition) ---------------- */
  .modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
    background:rgba(16,16,20,.55);padding:18px}
  .modal[hidden]{display:none}
  .modal-panel{background:var(--paper);border:1px solid var(--line2);width:min(1680px,97vw);max-height:94vh;
    display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(16,16,20,.3)}
  .modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:11px 14px;
    border-bottom:1px solid var(--line)}
  .modal-head h3{font-size:14px}
  .modal-head .cap{margin:3px 0 0;font-size:10.5px;color:var(--ink3);font-family:var(--mono)}
  .modal-tools{display:flex;align-items:center;gap:6px;flex:none}
  .modal-tools button{font:11px/1 var(--mono);background:var(--raised);border:1px solid var(--line);
    min-width:30px;height:27px;cursor:pointer;color:var(--ink)}
  .modal-tools button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .modal-tools button:disabled{opacity:.35;cursor:not-allowed}
  .modal-tools .readout{font-family:var(--mono);font-size:10.5px;color:var(--ink3);min-width:150px;text-align:right}
  .modal-body{padding:10px 14px 2px;overflow:hidden;flex:1;min-height:0}
  .modal-body svg{cursor:grab} .modal-body svg.dragging{cursor:grabbing}
  .modal-foot{padding:7px 14px 11px;color:var(--ink3);font-size:10.5px;font-family:var(--mono);
    display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .def-body{padding:4px 16px 16px;overflow:auto}
  .def-body h4{margin:14px 0 4px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink)}
  .def-body h4:first-child{margin-top:8px}
  .def-body p{margin:0 0 7px;font-size:12.5px;line-height:1.55}
  .def-body .src{font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-bottom:5px}
  .def-body .src a{color:var(--accent-ink);word-break:break-all}
  .def-body .pending{border:1px dashed var(--line2);padding:9px 11px;color:var(--ink2);font-size:11.5px;font-family:var(--mono)}
  .def-body .meta{border-top:1px solid var(--line);margin-top:11px;padding-top:9px;font-size:12px;color:var(--ink2)}
  .def-body .meta b{color:var(--ink);font-weight:600}
  .modal-panel.def{width:min(940px,96vw);max-height:88vh}

  /* ---------------- responsive: mobile = hamburger rail + scrolling charts ---------------- */
  @media (max-width:1180px){ .charts{grid-template-columns:minmax(0,1fr)} .card.wide{grid-column:auto} }
  @media (max-width:980px){
    body{height:auto;overflow:auto}
    main.shell{display:block}
    aside.rail{position:fixed;top:0;bottom:0;left:0;width:min(88vw,392px);transform:translateX(-102%);
      transition:transform .18s ease;z-index:40;border-right:1px solid var(--line2);
      box-shadow:8px 0 30px rgba(16,16,20,.18);padding-top:14px}
    aside.rail.open{transform:none}
    section.panes{overflow:visible;padding:12px 12px 48px}
    .burger{display:inline-flex;align-items:center;justify-content:center}
    header.bar{gap:8px 12px;padding:9px 12px}
    .brand{margin-right:auto;min-width:0;overflow:hidden}
    .brand h1{white-space:normal}
    .counts{display:none}
    .controls{margin-left:0;width:100%;flex-wrap:wrap;gap:6px}
    .seg button{padding:4px 7px;font-size:9px;letter-spacing:.06em}
    .vd{padding:0;border-left:0;min-width:0}
    .vd b{font-weight:600}
    .strip{grid-template-columns:repeat(2,minmax(0,1fr))}
    .modal{padding:8px}
  }
  @media (max-width:620px){
    .brand .meta{display:none}
  }
</style>
</head>
<body>

<header class="bar">
  <div class="brand">
    <h1>India Macro War Room</h1>
    <div class="meta">RBI Database on Indian Economy · latest data <b id="asof">–</b> · built <span id="built">–</span></div>
  </div>
  <div class="vd"><i id="vdot"></i><b id="verdict">–</b></div>
  <div class="counts" id="counts"></div>
  <div class="controls">
    <div class="seg" role="group" aria-label="Tile order">
      <button id="sort-theme" class="on">By theme</button><button id="sort-worst">Worst first</button>
    </div>
    <div class="seg" role="group" aria-label="Chart density">
      <button id="d-comfy" class="on">Comfort</button><button id="d-compact">Compact</button><button id="d-dense">Fit all</button>
    </div>
    <div class="seg" role="group" aria-label="Colour theme">
      <button id="t-light" title="Light theme" aria-label="Light theme">&#9728; Light</button>
      <button id="t-dark" title="Dark theme" aria-label="Dark theme">&#9789; Dark</button>
    </div>
    <button id="burger" class="burger" aria-label="Show indicators" aria-expanded="false">&#9776;</button>
  </div>
</header>
<div class="backdrop" id="backdrop" hidden></div>

<main class="shell">
  <aside class="rail" id="rail" aria-label="Indicator tiles">
    <div class="rail-head"><span class="micro">Indicators</span>
      <span class="hint" id="rail-count"></span></div>
    <div id="rail-groups"></div>
  </aside>
  <section class="panes" id="panes">
    <div class="warnbar" id="caveat"></div>
    <div id="chart-sections"></div>
  </section>
</main>

<!-- chart modal: opened by the expand button or anywhere on a chart card -->
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="m-title">
  <div class="modal-panel">
    <div class="modal-head">
      <div><h3 id="m-title">chart</h3><p class="cap" id="m-cap"></p></div>
      <div class="modal-tools">
        <span class="readout" id="m-window"></span>
        <button id="m-out" title="Zoom out" aria-label="Zoom out">&minus;</button>
        <button id="m-in" title="Zoom in" aria-label="Zoom in">+</button>
        <button id="m-reset" title="Reset zoom">reset</button>
        <button id="m-close" title="Close (Esc)" aria-label="Close chart">&#10005;</button>
      </div>
    </div>
    <div class="modal-body" id="m-body"></div>
    <div class="modal-foot"><span id="m-range"></span><span>drag to pan · scroll to zoom · Esc to close</span></div>
  </div>
</div>

<!-- history modal: opened by clicking a tile (or its &#8801;), listing what value prevailed when -->
<div class="modal" id="histmodal" hidden role="dialog" aria-modal="true" aria-labelledby="h-title">
  <div class="modal-panel hist">
    <div class="modal-head">
      <div><h3 id="h-title">history</h3><p class="cap" id="h-sub"></p></div>
      <div class="modal-tools"><button id="h-close" title="Close (Esc)" aria-label="Close history">&#10005;</button></div>
    </div>
    <div class="modal-body hist-body" id="h-body"></div>
  </div>
</div>

<!-- definition modal: opened by the ? on any tile or chart -->
<div class="modal" id="defmodal" hidden role="dialog" aria-modal="true" aria-labelledby="d-title">
  <div class="modal-panel def">
    <div class="modal-head">
      <div><h3 id="d-title">definition</h3><p class="cap" id="d-sub"></p></div>
      <div class="modal-tools"><button id="d-close" title="Close (Esc)" aria-label="Close definition">&#10005;</button></div>
    </div>
    <div class="modal-body def-body" id="d-body"></div>
  </div>
</div>

<script>
const DATA = {"definitions": {"exchange_rate": {"term": "USD/INR and EUR/INR spot exchange rates (Reference Rate)", "definition": "The reference rate is the official daily benchmark spot rate of the rupee, quoted as rupees per unit of foreign currency (INR per 1 USD; INR per 1 EUR). The Reserve Bank of India compiled and published it on Mumbai business days until 9 July 2018; since 10 July 2018 the benchmark has been computed and disseminated by Financial Benchmarks India Pvt. Ltd. (FBIL), an RBI-recognised benchmark administrator, and RBI reproduces the FBIL rates in the Weekly Statistical Supplement ('Ratios and Rates' table, rows 'INR-US$ Spot Rate' and 'INR-Euro Spot Rate'). FBIL's USD/INR rate is a volume-weighted average of actual spot USD/INR transactions on the Refinitiv and CCIL electronic trading platforms within a randomly selected 15-minute window between 11:30 and 12:30 hours, with trades beyond ±3 standard deviations excluded; the EUR/INR cross rate is derived by crossing that USD/INR rate with EUR/USD.", "source_name": "Financial Benchmarks India Pvt. Ltd. (FBIL) — Reference Rate (RBI-recognised benchmark administrator)", "source_url": "https://www.fbil.org.in/securities?mq=o&op=referencerate"}, "forward_premia": {"term": "US dollar forward premia (1, 3 and 6 months), per cent per annum", "definition": "Forward premia measure the annualised percentage by which the forward USD/INR rate exceeds the spot rate for a given tenor — the cost of buying dollars forward rather than spot. A positive premium means the rupee is at a forward discount to the dollar. They are computed from matched inter-bank USD/INR swap pairs (near leg = spot, far leg = forward) reported on the CCIL platform: the premium is the difference between the far-leg and near-leg rate as a percentage of the near-leg rate, annualised over the actual number of days between the two settlement dates. FBIL, the RBI-recognised benchmark administrator, publishes the premia curve, and RBI reproduces the 1-, 3- and 6-month rates in the Weekly Statistical Supplement ('Ratios and Rates' table, 'Inter-Bank Forward Premia of US Dollar'). A rise means dollars have become more expensive forward — typically a wider India-US interest-rate differential (covered interest parity), firmer expectations of rupee depreciation and/or stronger forward dollar demand from importers and hedgers.", "source_name": "FBIL — Methodology Document for the FBIL Forward Premia Curve and MIFOR Curve; reproduced in RBI's Weekly Statistical Supplement", "source_url": "https://www.fbil.org.in/uploads/REVISED_ETHODOLOGY_FOR_FORWARD_PREMIA_AND_MIFOR_CURVE_4b25a32468.pdf"}, "credit_deposit_ratio": {"term": "Credit-deposit ratio (outstanding and incremental)", "definition": "RBI publishes the credit-deposit ratio in the 'Ratios and Rates' table of its Weekly Statistical Supplement (and in the Monthly Bulletin); its compilation is described in the Guide to the RBI Monthly Bulletin and the Handbook on the WSS rather than in a statutory instrument. The outstanding ratio = total bank credit divided by aggregate deposits (demand plus time), expressed as a percentage — the share of the deposit base deployed as loans. The incremental credit-deposit ratio = incremental advances divided by incremental deposits, where the increments relate to the financial year so far, so a reading above 100 per cent means new lending exceeds fresh deposit mobilisation and the gap must be funded from non-deposit sources. RBI's September 2026 Bulletin article records the outstanding ratio rising from 68.6 per cent (September 2021) to 82.2 per cent (March 2026) and cautions that the ratio alone is not an appropriate measure of a banking system's funding vulnerability.", "source_name": "Reserve Bank of India — Guide to the RBI Monthly Bulletin; Weekly Statistical Supplement 'Ratios'; RBI Bulletin, September 2026", "source_url": "https://www.rbi.org.in/Scripts/PublicationsView.aspx?id=17618"}, "incremental_cd_ratio": {"term": "Incremental credit-deposit ratio", "definition": "Incremental credit-deposit ratio = incremental bank credit divided by incremental aggregate deposits, where the increments relate to the financial year so far. RBI publishes it alongside the outstanding ratio in the 'Ratios' table of the Weekly Statistical Supplement, using '**' or '&' markers where incremental deposits are negative and the ratio is undefined. A reading above 100 per cent means new lending exceeds fresh deposit mobilisation, so the gap must be funded from non-deposit sources; a low, zero or negative figure means deposit growth is keeping pace with or exceeding credit growth.", "source_name": "Reserve Bank of India — Weekly Statistical Supplement, 'Ratios' table", "source_url": "https://rbi.org.in/Scripts/WSSView.aspx?Id=28747"}, "cpi": {"term": "Consumer Price Index (CPI) inflation, combined", "definition": "CPI measures the average change over time in retail prices of a fixed basket of goods and services consumed by households. All-India CPI for Rural, Urban and Combined is compiled and released monthly (with a one-month lag) by the National Statistical Office, MoSPI; the Combined series (CPI-C) is the headline retail-inflation measure used for RBI's flexible inflation-targeting framework. The base year was revised from 2012=100 to 2024=100 by MoSPI (weights drawn from the Household Consumption Expenditure Survey 2023-24; 358 weighted items; COICOP 2018 classification). The dashboard computes y-o-y inflation from the 2024=100 Combined index.", "source_name": "MoSPI / National Statistical Office — PIB press release on the revised CPI base year", "source_url": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2291051&lang=1&reg=48"}, "wpi": {"term": "Wholesale Price Index (WPI) inflation", "definition": "WPI measures the average change in prices of commodities sold in bulk at the early stage of transactions; it covers goods only (no services) in three Major Groups — Primary Articles, Fuel and Power, and Manufactured Products. It is compiled and released monthly by the Office of the Economic Adviser, DPIIT, Ministry of Commerce and Industry. The current series has base year 2022-23 (released June 2026, replacing the 2011-12 series and expanding the item basket); the dashboard uses the 2022-23-based index and computes y-o-y inflation from it.", "source_name": "Office of the Economic Adviser, DPIIT, Ministry of Commerce & Industry — PIB press release on the new WPI series", "source_url": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2272872&lang=2&reg=48"}, "repo": {"term": "Policy repo rate", "definition": "The policy repo rate is the rate at which the Reserve Bank provides liquidity under the Liquidity Adjustment Facility to LAF participants against collateral of government and other approved securities. It is the single policy rate signalling the stance of monetary policy and is set by the six-member Monetary Policy Committee constituted under Section 45ZB of the Reserve Bank of India Act, 1934 (three RBI members, three external members; the Governor has a casting vote). The MPC's statutory mandate is the medium-term CPI inflation target of 4 per cent within a tolerance band of +/- 2 per cent, notified by the Central Government under Section 45ZA.", "source_name": "Reserve Bank of India — Monetary Policy framework; RBI Act, 1934, ss. 45ZA and 45ZB", "source_url": "https://static.pib.gov.in/WriteReadData/specificdocs/documents/2025/jun/doc202566565201.pdf"}, "callmoney": {"term": "Call money rate (weighted average)", "definition": "The call money rate is the interest rate on uncollateralised overnight lending and borrowing in the interbank call money market. The figure published in RBI's Weekly Statistical Supplement ('Ratios and Rates') is the weighted average of call money market rates during the week, the week running from Saturday to Friday. The weighted average call money rate is the operating target of monetary policy and also appears in RBI's daily 'Money Market Operations' release.", "source_name": "Reserve Bank of India — Weekly Statistical Supplement, 'Ratios and Rates'; Handbook on the WSS", "source_url": "https://rbi.org.in/scripts/publicationsView.aspx?id=15762"}, "liquidity": {"term": "Liquidity Adjustment Facility: net injection (+) / absorption (-), SDF and MSF", "definition": "The Liquidity Adjustment Facility covers the Reserve Bank's operations that inject liquidity into, or absorb liquidity from, the banking system: overnight and term repo/reverse repo (fixed and variable rate), the Standing Deposit Facility and the Marginal Standing Facility. Net injection (+)/absorption (-) is the net liquidity position — Repo + MSF + SLF less Reverse Repo less SDF — published daily in the 'Money Market Operations' release and weekly in the WSS 'Liquidity Operations by RBI' table. The SDF, at which RBI accepts uncollateralised overnight deposits from LAF participants, is the floor of the corridor (25 basis points below the repo rate) and replaced the fixed reverse repo as the floor in April 2022; the MSF, at which banks may borrow overnight by dipping into their SLR portfolio up to a limit, is the ceiling (25 basis points above the repo rate).", "source_name": "Reserve Bank of India — 'Money Market Operations' release; WSS 'Liquidity Operations by RBI' (item 8)", "source_url": "https://rbi.org.in/Scripts/BS_PressReleaseDisplay.aspx?prid=62917"}, "m3": {"term": "M3 / broad money", "definition": "M3, or broad money, is the RBI's principal measure of money supply, described as aggregate monetary resources: M3 = currency with the public + demand deposits with banks + time deposits with banks + 'other' deposits with the Reserve Bank. Currency with the public is currency in circulation less cash held by banks; demand deposits are liabilities payable on demand and time deposits are liabilities payable otherwise than on demand (both excluding inter-bank items); 'other' deposits with the RBI comprise deposits of foreign central banks, multilateral institutions and financial institutions plus sundry deposits, net of IMF Account No. 1. It is published weekly in the WSS 'Money Stock: Components and Sources' (item 6).", "source_name": "Reserve Bank of India — Handbook on the Weekly Statistical Supplement, 'Money Stock: Components and Sources'", "source_url": "https://rbidocs.rbi.org.in/rdocs/Publications/PDFs/HWSSF170614.pdf"}, "reserve_money": {"term": "Reserve money / base money (M0)", "definition": "Reserve money, also called base money or high-powered money, is the highly liquid component of the money stock and broadly reflects the total monetary liabilities of the Reserve Bank; monetary policy actions that change the size of RBI's balance sheet change reserve money. By RBI's definition, Reserve money = currency in circulation + bankers' deposits with the RBI + 'other' deposits with the RBI. Bankers' deposits are banks' current-account balances with RBI held mainly for the Cash Reserve Ratio and as working funds for clearing. It is published weekly in the WSS (item 7).", "source_name": "Reserve Bank of India — Handbook on the Weekly Statistical Supplement, 'Reserve Money: Components and Sources'", "source_url": "https://rbidocs.rbi.org.in/rdocs/Publications/PDFs/HWSSF170614.pdf"}, "notes_in_circulation": {"term": "Notes in circulation", "definition": "Notes in circulation comprises currency notes issued by the Government of India up to 1935 and by the Reserve Bank since then, less notes held in the Banking Department of the Bank — that is, notes held outside the RBI by the public, banks and treasuries (Government of India one-rupee notes issued since July 1940 are treated as rupee coins and excluded from this head). It is a liability of the Issue Department, where total notes issued = notes in circulation + notes held in the Banking Department, and is published weekly in the WSS 'Reserve Bank of India — Liabilities and Assets' table (item 1).", "source_name": "Reserve Bank of India — Handbook on the Weekly Statistical Supplement, 'RBI – Liabilities and Assets'", "source_url": "https://rbidocs.rbi.org.in/rdocs/Publications/PDFs/HWSSF170614.pdf"}, "currency_in_circulation": {"term": "Currency in circulation", "definition": "Currency in circulation includes notes in circulation, rupee coins and small coins, and is a component of reserve money. Banknotes are issued by the Reserve Bank of India while coins are issued by the Government of India and put into circulation by the RBI; in value terms banknotes account for roughly 99 per cent of currency in circulation. It is published weekly in the WSS; currency with the public is derived as currency in circulation less cash held by banks.", "source_name": "Reserve Bank of India — Handbook on the Weekly Statistical Supplement, 'Reserve Money: Components and Sources'", "source_url": "https://rbidocs.rbi.org.in/rdocs/Publications/PDFs/HWSSF170614.pdf"}, "gsec10y": {"term": "10-year Government of India benchmark G-Sec par yield (FBIL)", "definition": "The 10-year G-Sec par yield is the semi-annual par yield — the yield a hypothetical Government of India security would carry if priced at par — at the 10-year point of the daily FBIL G-Sec Par Yield Curve. FBIL, designated the RBI's benchmark administrator for government securities with effect from 31 March 2018, derives the curve from transaction-level data on the RBI's NDS-OM platform using a cubic-spline model and publishes G-Sec prices, yields-to-maturity and the par yield curve every Mumbai business day. RBI republishes the figure as '10-Year G-Sec Par Yield (FBIL)' in the WSS/Bulletin, where it is the benchmark long-term sovereign yield.", "source_name": "FBIL — G-Sec Par Yield Curve (FBIL newsletter/explanatory notes); RBI circular FMRD.DIRD.7/14.03.025/2017-18", "source_url": "https://www.fbil.org.in/uploads/Newsletter_for_the_month_of_April_2024_ea8fe6cc8f.pdf"}, "treasury_bills": {"term": "Treasury bills (91-day, 182-day, 364-day) and Cash Management Bills", "definition": "Treasury bills are short-term money-market instruments issued by the Government of India and sold through auctions conducted by the RBI in three tenors — 91-day, 182-day and 364-day. They are zero-coupon securities issued at a discount and redeemed at face value, so the return is the difference between face value and issue price; the cut-off (primary) yield is set in a multiple-price auction, normally held on Wednesdays on the RBI's NDS platform with T+1 settlement. Cash Management Bills, introduced in 2010 by the Government in consultation with the RBI, are discounted instruments with the generic character of T-bills issued to bridge temporary cash-flow mismatches of the Government, with maturities shorter than 91 days.", "source_name": "Reserve Bank of India — Government Securities Market in India: A Primer (FAQs)", "source_url": "https://rbi.org.in/scripts/FS_FAQs.aspx?Id=79"}, "certificate_of_deposit": {"term": "Certificate of Deposit (CD)", "definition": "RBI defines a certificate of deposit as a negotiable, unsecured money-market instrument issued by a bank as a usance promissory note against funds deposited at the bank for a maturity of up to one year. CDs may be issued only by Scheduled Commercial Banks, Regional Rural Banks and Small Finance Banks, to residents in India, and only in dematerialised form held with a SEBI-registered depository. Minimum denomination is ₹5 lakh and multiples of ₹5 lakh thereafter, and the tenor at issuance must be not less than seven days and not more than one year. These rules sit in the Master Direction — RBI (Certificate of Deposit) Directions, 2021, issued under sections 45W/45U of the RBI Act, 1934.", "source_name": "RBI Master Direction — Reserve Bank of India (Certificate of Deposit) Directions, 2021", "source_url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=12108"}, "commercial_paper": {"term": "Commercial Paper (CP)", "definition": "RBI defines commercial paper as an unsecured money-market instrument issued in the form of a promissory note. It may be issued by companies, NBFCs (including housing finance companies), InvITs, REITs, All India Financial Institutions and other bodies corporate with a minimum net worth of ₹100 crore, provided all fund-based facilities availed by the issuer are classified as Standard at the time of issue. CPs are issued at a discount to face value in dematerialised form, in minimum denominations of ₹5 lakh and multiples thereafter, with a tenor of not less than seven days and not more than one year, and must carry a minimum credit rating of A3. These rules are set out in the Master Direction — RBI (Commercial Paper and Non-Convertible Debentures of original or initial maturity up to one year) Directions, 2024.", "source_name": "RBI Master Direction — Commercial Paper and Non-Convertible Debentures Directions, 2024", "source_url": "https://rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=12592"}, "money_market_turnover": {"term": "Money-market turnover (call, notice/term money, triparty repo, market repo)", "definition": "RBI publishes money-market turnover as 'Average Daily Turnover in Select Money Markets' in the Weekly Statistical Supplement, covering call money, notice/term money, triparty repo, market repo and repo in corporate bonds; it also appears daily in the 'Money Market Operations' release as volume measured on one leg, alongside the weighted average rate and rate range. Call money is unsecured borrowing or lending overnight; notice money covers tenors up to and including 14 days; term money covers periods over 14 days and up to one year. Turnover counts both sides of a transaction — twice the single-leg volume for call/notice/term money and triparty repo, and four times for market repo and repo in corporate bonds. The erstwhile Collateralised Borrowing and Lending Obligation segment was replaced by triparty repo with effect from 5 November 2018.", "source_name": "RBI Weekly Statistical Supplement — Average Daily Turnover in Select Money Markets (item 12)", "source_url": "https://www.rbi.org.in/Scripts/WSSView.aspx?Id=28379"}, "fca": {"term": "Foreign Currency Assets (FCA) and India's foreign exchange reserves", "definition": "Foreign currency assets are the largest component of India's foreign exchange reserves; the reserves comprise FCA, gold, Special Drawing Rights and the Reserve Bank's reserve position in the IMF. FCA are maintained in major currencies and invested in multi-currency, multi-asset portfolios including US Treasury bonds, bonds and treasury bills of other selected governments and deposits with foreign central banks and commercial banks, although the reserves are denominated and expressed in US dollars only. Movements occur mainly on account of RBI purchases and sales of foreign exchange, income from deployment of the reserves, external aid receipts of the Central Government and revaluation of assets. RBI publishes the weekly FCA level in the WSS.", "source_name": "RBI — A Handbook on RBI's Weekly Statistical Supplement: Concepts, Definitions and Methodologies", "source_url": "https://rbidocs.rbi.org.in/rdocs/Publications/PDFs/HWSSF170614.pdf"}, "gold": {"term": "RBI gold holdings (gold component of the reserves)", "definition": "Gold is the second component of India's foreign exchange reserves and represents gold coin and bullion held by the Reserve Bank in both the Issue Department and the Banking Department. RBI values this gold close to international market prices, revaluing it at the end of each month at 90 per cent of the daily average price quoted by the London Bullion Market Association, and publishes the resulting value weekly in the WSS. The published figure therefore moves with both the quantity of gold held and international gold prices — a rise does not necessarily mean the RBI bought gold.", "source_name": "RBI — A Handbook on RBI's Weekly Statistical Supplement: Concepts, Definitions and Methodologies", "source_url": "https://rbidocs.rbi.org.in/rdocs/Publications/PDFs/HWSSF170614.pdf"}, "bank_credit": {"term": "Bank credit of scheduled commercial banks", "definition": "Bank credit of scheduled commercial banks is the aggregate outstanding loans and advances (in India) of SCBs. In RBI's fortnightly statement it is the sum of food credit and non-food credit — Bank credit = food credit + non-food credit — so food credit is included and non-food credit is bank credit less food credit. RBI compiles it from the fortnightly Form A return furnished by all SCBs under Section 42(2) of the RBI Act, 1934, and publishes it as item 7 'Bank Credit' in the 'Scheduled Commercial Banks — Business in India' statement in the WSS/RBI Bulletin, in rupees crore, provisionally and fortnightly.", "source_name": "RBI — A Handbook on RBI's Weekly Statistical Supplement, Section 4: Scheduled Commercial Banks – Business in India", "source_url": "https://rbidocs.rbi.org.in/rdocs/Publications/PDFs/HWSSF170614.pdf"}, "aggregate_deposits": {"term": "Aggregate deposits with scheduled commercial banks", "definition": "Aggregate deposits with scheduled commercial banks is the aggregation of demand and time deposits of branches in and outside India. Demand deposits are liabilities payable on demand (current deposits, the demand-liability portion of savings deposits, credit balances in overdrafts and cash credit), while time deposits are liabilities payable otherwise than on demand (fixed deposits, cash certificates, cumulative and recurring deposits, the time-liability portion of savings deposits). RBI's CRR/SLR Master Direction states that 'aggregate deposits' means the aggregation of demand and time deposits. It is compiled from the fortnightly Form A return of SCBs under Section 42(2) of the RBI Act, 1934, and published as item 2.1 'Aggregate Deposits' in the WSS/RBI Bulletin.", "source_name": "RBI Master Direction — Cash Reserve Ratio and Statutory Liquidity Ratio Directions, 2021 (definition of aggregate deposits)", "source_url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=12131"}, "bank_investments": {"term": "Bank investments in government and other approved securities", "definition": "In the SCB fortnightly statement, 'Investments' is the outstanding total investment by scheduled commercial banks in government and other approved (SLR) securities. Investments in government securities include Central and State Government securities (including treasury bills) and postal obligations such as national savings certificates; 'other approved securities' are securities of state-associated bodies (electricity boards, housing boards, corporation bonds), land development bank debentures and Regional Rural Bank shares treated as approved securities under Section 5(a) of the Banking Regulation Act, 1949. RBI compiles it from the fortnightly Form A return and publishes it as item 6 'Investments' (with 6.1 Government Securities and 6.2 Other Approved Securities) in the WSS/RBI Bulletin.", "source_name": "RBI — A Handbook on RBI's Weekly Statistical Supplement, Section 4 (Investments)", "source_url": "https://rbidocs.rbi.org.in/rdocs/Publications/PDFs/HWSSF170614.pdf"}, "net_fx_assets": {"term": "Net foreign exchange assets of the banking sector", "definition": "Net foreign exchange assets of the banking sector is a source of money stock (M3) in RBI's monetary survey: the total of the RBI's net foreign exchange assets and those of other banks, the latter being authorised dealers' net foreign currency balances after credit and debit foreign-currency balances. RBI's own net foreign exchange assets are its holdings of foreign currency assets and gold adjusted for foreign liabilities (net of non-monetary foreign exchange liabilities such as IMF Account No. 1). RBI compiles and publishes it fortnightly in the WSS 'Money Stock: Components and Sources' and the corresponding monetary survey, in rupees crore.", "source_name": "RBI — Guide to the RBI Monthly Bulletin, Table 7 'Sources of Money Stock (M3)'; WSS 'Money Stock: Components and Sources'", "source_url": "https://www.rbi.org.in/Scripts/PublicationsView.aspx?id=17618"}, "food_credit": {"term": "Food credit (procurement credit to FCI and state agencies)", "definition": "Food credit is a category of bank credit comprising advances by scheduled commercial banks to the Food Corporation of India, State Governments and State Co-operative agencies for food procurement operations; together with non-food credit it adds up to total bank credit. RBI compiles it from the fortnightly Form A return of all SCBs under Section 42(2) of the RBI Act, 1934, and publishes it as item 7a.1 'Food Credit' of the 'Scheduled Commercial Banks — Business in India' statement in the WSS/RBI Bulletin, in rupees crore. It is seasonal, moving with the procurement calendar, so its y-o-y growth swings widely.", "source_name": "RBI — A Handbook on RBI's Weekly Statistical Supplement, Section 4: SCB – Business in India (item 7a.1 Food Credit)", "source_url": "https://rbidocs.rbi.org.in/rdocs/Publications/PDFs/HWSSF170614.pdf"}, "m1": {"term": "M1 / narrow money", "definition": "M1, or narrow money, is the most liquid measure of money supply: M1 = currency with the public + demand deposits with banks + 'other' deposits with the Reserve Bank. It is published alongside M2 and M3 in RBI's 'Money Stock: Components and Sources' (item 6 of the Weekly Statistical Supplement) and in the Monthly Bulletin. M1 tracks transactions demand for money — it excludes time deposits, so it moves with spending and cash preference rather than savings behaviour, which is why it is read together with M3.", "source_name": "Reserve Bank of India — Handbook on the Weekly Statistical Supplement, 'Money Stock: Components and Sources'", "source_url": "https://rbidocs.rbi.org.in/rdocs/Publications/PDFs/HWSSF170614.pdf"}, "money_multiplier": {"term": "Money multiplier (M3 ÷ reserve money)", "definition": "The money multiplier is the ratio of broad money to reserve money — how many rupees of M3 the banking system creates per rupee of base money — computed here as M3 divided by reserve money on the nearest matching weekly observation. RBI publishes both components (M3 in 'Money Stock: Components and Sources', reserve money in 'Reserve Money: Components and Sources') but does not publish this ratio as a series, so the figure shown is derived by this dashboard. A rising multiplier means banks are converting base money into deposits and credit more efficiently; a falling multiplier means liquidity is being absorbed into reserves that are not being lent on.", "source_name": "Derived in this dashboard from RBI WSS 'Money Stock' (M3) and 'Reserve Money' — components published by RBI, ratio is not an RBI series", "source_url": "https://www.rbi.org.in/Scripts/PublicationsView.aspx?id=17618"}, "bankers_deposits": {"term": "Bankers' deposits with the Reserve Bank", "definition": "Bankers' deposits are the current-account balances that banks hold with the Reserve Bank, held mainly to satisfy the Cash Reserve Ratio (CRR) and as working funds for clearing and settlement. They are one of the three components of reserve money (reserve money = currency in circulation + bankers' deposits with the RBI + 'other' deposits with the RBI) and appear as item 2.4 'Scheduled Commercial Banks' within the 'Deposits' block of the WSS 'RBI — Liabilities and Assets' table. Because they are the balance the banking system keeps at the central bank, their growth is a direct read on system liquidity and the reserves banks are putting to work.", "source_name": "Reserve Bank of India — Handbook on the Weekly Statistical Supplement, 'Reserve Money: Components and Sources' and 'RBI – Liabilities and Assets'", "source_url": "https://rbidocs.rbi.org.in/rdocs/Publications/PDFs/HWSSF170614.pdf"}, "rbi_credit_to_govt": {"term": "RBI loans and advances to the Central Government", "definition": "These are the Reserve Bank's direct loans and advances to the Central Government — Ways and Means Advances and any overdue WMA that becomes an overdraft — reported as item 4.1 'Central Government' under 'Loans and Advances' in the WSS 'RBI — Liabilities and Assets' table. Ways and Means Advances are provided by the RBI under Section 17(5) of the Reserve Bank of India Act, 1934, to bridge temporary mismatches between the government's receipts and payments; the limit is set in agreement with the Government, and they are meant to be temporary, so persistent borrowing here is read as a sign of fiscal pressure. This item covers the Central Government only; the State Government counterpart is a separate line.", "source_name": "RBI Act, 1934, s. 17(5) (per RBI's published WMA documentation); RBI — Handbook on the WSS, 'RBI – Liabilities and Assets'", "source_url": "https://rbidocs.rbi.org.in/rdocs/Publications/PDFs/HWSSF170614.pdf"}, "rupee_securities": {"term": "RBI rupee securities (including treasury bills)", "definition": "Rupee securities held by the Reserve Bank are its holdings of Government of India dated securities and treasury bills, reported as item 3 'Rupee Securities (including Treasury Bills)' in the WSS 'RBI — Liabilities and Assets' table. They rise when the RBI absorbs government paper (through primary-market devolvement, outright open-market operations, or its liquidity operations) and fall when it sells securities back. Growth in this line therefore shows the central bank financing or absorbing government borrowing, which matters for both liquidity conditions and the fiscal-monetary interface.", "source_name": "Reserve Bank of India — Handbook on the Weekly Statistical Supplement, 'RBI – Liabilities and Assets'", "source_url": "https://rbidocs.rbi.org.in/rdocs/Publications/PDFs/HWSSF170614.pdf"}, "crr": {"term": "Cash Reserve Ratio (CRR)", "definition": "The Cash Reserve Ratio is the share of a bank's net demand and time liabilities (aggregate deposits) that it must hold as a cash balance with the Reserve Bank. It is imposed under Section 42 of the Reserve Bank of India Act, 1934, and the operative rules are set out in the Master Direction — RBI (Cash Reserve Ratio and Statutory Liquidity Ratio) Directions, 2021, issued under Section 35A of the Banking Regulation Act, 1949 and pursuant to Section 42 of the RBI Act. RBI publishes the rate in force week by week in the WSS 'Ratios and Rates' table. A CRR cut releases lendable funds and raises the money multiplier; a hike absorbs them, so a change here is itself policy news.", "source_name": "RBI Master Direction — Cash Reserve Ratio and Statutory Liquidity Ratio Directions, 2021", "source_url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=12131"}, "slr": {"term": "Statutory Liquidity Ratio (SLR)", "definition": "The Statutory Liquidity Ratio is the minimum share of a bank's net demand and time liabilities it must hold in approved liquid assets — cash, gold, and unencumbered government and other approved securities, including Treasury Bills of the Government of India. It is governed by the same Master Direction as the CRR (issued under Section 35A of the Banking Regulation Act, 1949 and pursuant to Section 42 of the RBI Act, 1934) and published in the WSS 'Ratios and Rates' table. A reduction frees banks to lend; it also lowers the demand for government securities, so an SLR change is watched on both the credit and the bond-market side.", "source_name": "RBI Master Direction — Cash Reserve Ratio and Statutory Liquidity Ratio Directions, 2021", "source_url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=12131"}, "term_spread": {"term": "Term spread (10-year G-sec par yield − 91-day T-bill yield)", "definition": "The term spread is the 10-year Government of India par yield minus the 91-day Treasury bill primary yield, computed here from two columns of the same RBI weekly 'Ratios and Rates' table so both legs share one vintage. It is derived by this dashboard and is not published as a series by RBI. A positive, normall /* ---------- formatting ---------- */
function fmtVal(v, unit){
  if(v===null||v===undefined||isNaN(v)) return '–';
  if(unit==='%') return v.toFixed(2);
  if(unit==='₹ crore'){ const a=Math.abs(v); return a>=1e5 ? (v/1e5).toFixed(2)+' lakh cr' : Math.round(v).toLocaleString('en-IN'); }
  return (Math.round(v*100)/100).toLocaleString('en-IN');
}
function fmtDelta(d, unit){
  if(d===null||d===undefined||isNaN(d)) return '';
  const a=Math.abs(d);
  if(unit==='₹ crore') return (d>0?'+':'')+(a>=1e5?(d/1e5).toFixed(2)+'L':Math.round(d).toLocaleString('en-IN'));
  return (d>0?'+':'')+d.toFixed(a<1?2:2)+(unit==='%'?' pp':'');
}
function axisLabel(v, unit){
  if(unit==='₹ crore'){ const a=Math.abs(v); return a>=10000 ? (v/1000).toFixed(0)+'k' : v.toFixed(0); }
  if(unit==='₹') return v.toFixed(1);
  if(unit==='%'){ const a=Math.abs(v); return (a>=10||a===0) ? v.toFixed(0) : v.toFixed(1); }
  if(unit==='x') return v.toFixed(1)+'x';
  return v>=100||v<=-100 ? v.toFixed(0) : v.toFixed(1);
}
function tipValue(v, unit){
  if(unit==='₹ crore') return Math.round(v).toLocaleString('en-IN')+' cr';
  if(unit==='₹') return v.toFixed(2);
  if(unit==='x') return v.toFixed(2)+'x';
  if(unit==='pp') return (v>0?'+':'')+v.toFixed(2)+'pp';
  return v.toFixed(2)+'%';
}
function yAxisTitle(cfg){
  if(cfg.unit==='₹ crore') return '₹ crore';
  if(cfg.unit==='₹') return '₹ per US$ / EUR';
  if(cfg.unit==='x') return 'ratio (x)';
  if(cfg.unit==='pp') return 'percentage points';
  if(cfg.opts&&cfg.opts.band) return '% y-o-y vs target';
  return cfg.yTitle || '%';
}
function tickLabel(iso, n){
  const dt=new Date(iso+'T00:00:00Z');
  const m=dt.toLocaleString('en-GB',{month:'short',timeZone:'UTC'});
  return n>150 ? (m+" '"+String(dt.getUTCFullYear()).slice(2))
       : n>60  ? (m+' '+String(dt.getUTCFullYear()).slice(2))
               : (dt.getUTCDate()+' '+m);
}

/* ---------- windowing ---------- */
function sliceWin(key, n, pan){
  const pts=S[key].points;
  return pts.slice(Math.max(0, pts.length - pan - n), pts.length - pan);
}
function builtSeries(cfg, n, pan){
  return cfg.keys.map(s=>({key:s.key, label:(cfg.legend.find(l=>l[1]===s.color)||['',''])[0]||s.key,
                           color:C[s.color]||C.accent, fill:!!s.fill, points:sliceWin(s.key, n, pan)}));
}
function chartKeys(cfg){ return cfg.kind==='line' ? cfg.keys.map(k=>k.key) : [cfg.barKey, cfg.avgKey]; }
function chartMaxLen(cfg){ return Math.max(...chartKeys(cfg).map(k=>S[k].points.length)); }

/* ---------- drawing ---------- */
function drawChart(wrap, cfg, n, pan, W, H){
  const bars  = cfg.kind==='bar' ? sliceWin(cfg.barKey, n, pan) : null;
  const avg   = cfg.kind==='bar' ? sliceWin(cfg.avgKey, n, pan) : null;
  const series= cfg.kind==='line' ? builtSeries(cfg, n, pan) : [];
  const all   = cfg.kind==='line' ? series.flatMap(s=>s.points.map(p=>p[1])) : bars.map(p=>p[1]).concat(avg.map(p=>p[1]));
  if(!all.length){ wrap.innerHTML='<div class="cap">no data in this window</div>'; return; }

  const dates = cfg.kind==='line'
    ? Array.from(new Set(series.flatMap(s=>s.points.map(p=>p[0])))).sort()
    : bars.map(p=>p[0]);
  const pos = new Map(dates.map((d,i)=>[d,i]));
  const nD = dates.length;
  let lo=Math.min(...all), hi=Math.max(...all);
  if(cfg.band){ lo=Math.min(lo,cfg.band[0]); hi=Math.max(hi,cfg.band[1]); }
  if(cfg.zeroLine){ lo=Math.min(lo,0); hi=Math.max(hi,0); }
  if(cfg.kind==='bar'){ lo=Math.min(lo,0); hi=Math.max(hi,0); }
  const pv=(hi-lo)*0.10||1; lo-=pv; hi+=pv;

  /* paddings scale with H, so the flat "fit all" density stays legible instead of crushing labels */
  const L=Math.max(34, Math.round(W*0.098)), R=14, TP=Math.max(18, Math.round(H*0.085)),
        B=Math.max(34, Math.round(H*0.24));   // room for the tick row AND the axis title row
  const xD=d=> L+(pos.get(d)/(nD-1||1))*(W-L-R);
  const xI=i=> L+(i+0.5)/nD*(W-L-R);
  const y =v=> TP+(1-(v-lo)/(hi-lo||1))*(H-TP-B);
  const fs = H<130 ? 10 : 11;                       // axis text (viewBox units)
  let g='';

  for(let k=0;k<=4;k++){
    const val=lo+(hi-lo)*k/4, yy=y(val);
    g+=`<line x1="${L}" y1="${yy.toFixed(1)}" x2="${W-R}" y2="${yy.toFixed(1)}" stroke="${C.grid}" stroke-width="1"/>`;
    g+=`<text x="${L-6}" y="${(yy+3.4).toFixed(1)}" fill="${C.dim2}" font-size="${fs}" text-anchor="end">${axisLabel(val,cfg.unit)}</text>`;
  }
  // axis unit sits ABOVE the plot, left-aligned with its left edge - never on the tick-label column
  g+=`<text x="${L}" y="${Math.max(10,TP-7)}" fill="${C.dim}" font-size="${fs-0.5}" text-anchor="start">${yAxisTitle(cfg)}</text>`;

  const maxTicks = Math.max(3, Math.round((W-L-R)/110));
  const stepT = Math.max(1, Math.ceil(nD/maxTicks));
  const ticks = [];
  for(let i=0;i<nD;i+=stepT) ticks.push(i);
  /* ALWAYS label the NEWEST observation: the regular grid can stop a whole interval short of the end,
     which is exactly how "the latest data point isn't on the chart" happens. If that last label lands
     too close to the previous one, it replaces it instead of overlapping. */
  if(nD>1 && ticks[ticks.length-1] !== nD-1){
    const gapPx = ((nD-1) - ticks[ticks.length-1]) * ((W-L-R)/(nD-1||1));
    if(gapPx < 54) ticks.pop();
    ticks.push(nD-1);
  }
  ticks.forEach(i=>{
    const xx = cfg.kind==='line' ? xD(dates[i]) : xI(i);
    g+=`<line x1="${xx.toFixed(1)}" y1="${(H-B).toFixed(1)}" x2="${xx.toFixed(1)}" y2="${(H-B+3).toFixed(1)}" stroke="${C.axis}"/>`;
    g+=`<text x="${xx.toFixed(1)}" y="${(H-B+fs+5).toFixed(1)}" fill="${C.dim2}" font-size="${fs}" text-anchor="middle">${tickLabel(dates[i], nD)}</text>`;
  });
  g+=`<line x1="${L}" y1="${(H-B).toFixed(1)}" x2="${W-R}" y2="${(H-B).toFixed(1)}" stroke="${C.axis}"/>`;
  // the x-axis title lives on its OWN row under the tick labels - at the right edge it collided with
  // the last tick label, which is now pinned to the newest data point
  g+=`<text x="${L}" y="${(H-B+fs*2+7).toFixed(1)}" fill="${C.dim}" font-size="${fs-0.5}" text-anchor="start">date</text>`;

  if(cfg.band){
    g+=`<rect x="${L}" y="${y(cfg.band[1]).toFixed(1)}" width="${W-L-R}" height="${Math.max(0,y(cfg.band[0])-y(cfg.band[1])).toFixed(1)}" fill="${C.band}"/>`;
    g+=`<line x1="${L}" y1="${y(cfg.band[2]).toFixed(1)}" x2="${W-R}" y2="${y(cfg.band[2]).toFixed(1)}" stroke="${C.good}" stroke-dasharray="5 4" stroke-width="1"/>`;
    g+=`<text x="${W-R-3}" y="${(y(cfg.band[2])-4).toFixed(1)}" fill="${C.good}" font-size="${fs-0.5}" text-anchor="end">target ${cfg.band[2]}</text>`;
  }
  if(cfg.zeroLine){
    g+=`<line x1="${L}" y1="${y(0).toFixed(1)}" x2="${W-R}" y2="${y(0).toFixed(1)}" stroke="${C.zero}" stroke-width="1.2"/>`;
    g+=`<text x="${W-R-3}" y="${(y(0)-4).toFixed(1)}" fill="${C.dim2}" font-size="${fs-0.5}" text-anchor="end">0</text>`;
  }

  if(cfg.kind==='bar'){
    const bw=Math.max(1.2,(W-L-R)/nD*0.66);
    bars.forEach((p,i)=>{
      const y0=y(0), y1=y(p[1]);
      g+=`<rect x="${(xI(i)-bw/2).toFixed(1)}" y="${Math.min(y0,y1).toFixed(1)}" width="${bw.toFixed(1)}"
           height="${Math.abs(y1-y0).toFixed(1)}" fill="${p[1]>=0?C.pos:C.neg}"/>`;
    });
    // mark the NEWEST bar as well: a small bar is easy to miss, and "where does this series end"
    // must be answerable at a glance on every chart type
    if(bars.length){
      const lb=bars[bars.length-1];
      g+=`<circle class="lastdot" cx="${xI(bars.length-1).toFixed(1)}" cy="${y(lb[1]).toFixed(1)}" r="2.7"
             fill="${lb[1]>=0?C.pos:C.neg}" stroke="${C.ink}" stroke-width=".9"/>`;
    }
    const idx=new Map(bars.map((p,i)=>[p[0],i]));
    const al=avg.filter(p=>idx.has(p[0]));
    if(al.length){
      if(al.length>1){
        const d=al.map((p,i)=>`${i?'L':'M'}${xI(idx.get(p[0])).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ');
        g+=`<path d="${d}" fill="none" stroke="${C.accent}" stroke-width="2"/>`;
      }
      const lp=al[al.length-1], lx=xI(idx.get(lp[0]));
      g+=`<circle class="lastdot" cx="${lx.toFixed(1)}" cy="${y(lp[1]).toFixed(1)}" r="2.7" fill="${C.accent}"/>`;
    }
  } else {
    const base=y(cfg.zeroLine?0:lo).toFixed(1);
    series.forEach(s=>{
      if(!s.points.length) return;
      const d=s.points.map(p=>`${p[0]===s.points[0][0]?'M':'L'}${xD(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ');
      if(s.fill) g+=`<path d="${d} L${xD(s.points[s.points.length-1][0]).toFixed(1)},${base} L${xD(s.points[0][0]).toFixed(1)},${base} Z" fill="${s.color}" opacity=".10"/>`;
      g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="1.8" stroke-linejoin="round"/>`;
      const lp=s.points[s.points.length-1];
      g+=`<circle class="lastdot" cx="${xD(lp[0]).toFixed(1)}" cy="${y(lp[1]).toFixed(1)}" r="2.7" fill="${s.color}"/>`;
    });
  }

  g+=`<g class="xh" style="display:none"><line x1="0" y1="${TP}" x2="0" y2="${H-B}" stroke="${C.cross}" stroke-width="1" stroke-dasharray="3 3"/>`;
  const nCir = cfg.kind==='line' ? series.length : 2;
  for(let i=0;i<nCir;i++) g+=`<circle class="xhc" r="3.2" fill="none" stroke-width="2"/>`;
  g+=`</g>`;

  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${cfg.title}">${g}</svg><div class="tip"></div>`;
  wrap._meta = {cfg, W, H, L, R, TP, B, dates, pos, xD, xI, y, series, bars, avg,
                vals: cfg.kind==='line'
                  ? series.map(s=>({label:s.label, color:s.color, byDate:new Map(s.points.map(p=>[p[0],p[1]]))}))
                  : [{label:cfg.legend[0][0], color:C[cfg.legend[0][1]], byDate:new Map(bars.map(p=>[p[0],p[1]]))},
                     {label:cfg.legend[1][0], color:C[cfg.legend[1][1]], byDate:new Map(avg.map(p=>[p[0],p[1]]))}]};
  if(!wrap._hover){
    wrap._hover=true;
    const move=(ev)=>{
      const m=wrap._meta; if(!m) return;
      const svg=wrap.querySelector('svg'); if(!svg) return;
      const rect=svg.getBoundingClientRect();
      const cv=ev.touches? ev.touches[0] : ev;
      const xv=(cv.clientX-rect.left)/rect.width*m.W;
      if(xv<m.L-2 || xv>m.W-m.R+8){ hideTip(wrap); return; }   // wider at the right end: the newest
                                                              // point sits ON the right edge
      const frac=(xv-m.L)/(m.W-m.L-m.R);
      let i=Math.max(0, Math.min(m.dates.length-1, Math.round(frac*(m.dates.length-1))));
      if(m.cfg.kind==='bar') i=Math.max(0, Math.min(m.bars.length-1, Math.floor(frac*m.bars.length)));
      const date=m.dates[i];
      const xx=(m.cfg.kind==='line'? m.xD(date) : m.xI(i));
      const rows=m.vals.map(v=>({label:v.label, color:v.color, val:v.byDate.get(date)})).filter(r=>r.val!==undefined);
      if(!rows.length){ hideTip(wrap); return; }
      const gx=wrap.querySelector('.xh');
      if(gx){
        gx.style.display='';
        gx.querySelector('line').setAttribute('x1',xx.toFixed(1));
        gx.querySelector('line').setAttribute('x2',xx.toFixed(1));
        const cs=gx.querySelectorAll('circle');
        rows.forEach((r,k)=>{ if(cs[k]){ cs[k].setAttribute('cx',xx.toFixed(1));
          cs[k].setAttribute('cy',m.y(r.val).toFixed(1)); cs[k].setAttribute('stroke',r.color); cs[k].style.display=''; }});
        for(let k=rows.length;k<cs.length;k++) cs[k].style.display='none';
      }
      const tip=wrap.querySelector('.tip');
      tip.innerHTML=`<div class="d">${date}</div>`+rows.map(r=>
        `<div class="r"><i style="background:${r.color}"></i><span>${r.label}</span><b>${tipValue(r.val,m.cfg.unit)}</b></div>`).join('');
      const px=(xx/m.W)*rect.width;
      tip.style.display='block';
      tip.style.left=Math.max(2, Math.min(rect.width-tip.offsetWidth-2, px-tip.offsetWidth/2))+'px';
    };
    wrap.addEventListener('pointermove', move);
    wrap.addEventListener('touchmove', move, {passive:true});
    wrap.addEventListener('pointerleave', ()=>hideTip(wrap));
  }
}
function hideTip(wrap){
  const t=wrap.querySelector('.tip'); if(t) t.style.display='none';
  const g=wrap.querySelector('.xh'); if(g) g.style.display='none';
}

/* ---------- tiles (left rail) ----------
   Groups carry an explicit order and a one-line note. Spans are packed so EVERY row of the
   2-column rail is full: if a group's span total is odd, its first tile (the headline of the
   group) takes both columns. */
const GROUPS = [
  {id:'prices',  no:'01', name:'Prices',              note:'RBI target: CPI 4% ±2%',
   ids:['cpi','wpi','wpifuel','wpimanu','wpiprim','cpirural','cpiurban']},
  {id:'policy',  no:'02', name:'Policy rates',        note:'direction read: cut = supportive',
   ids:['repo','callmoney','crr','slr']},
  {id:'money',   no:'03', name:'Money & currency',    note:'M3 broad · M1 transactions',
   ids:['m3','rm','m1','notes','moneymult']},
  {id:'liquidity',no:'04', name:'Liquidity',           note:'SDF-era absorption is normal',
   ids:['liquidity','bankdep']},
  {id:'credit',  no:'05', name:'Credit & banking',     note:'credit needs deposits to fund it',
   ids:['credit','deposit','cdr','invest','nonfood','food']},
  {id:'markets', no:'06', name:'Markets',              note:'yields, spreads, issuance',
   ids:['gsec','yld91','termspread','turnover','cdout','cpout']},
  {id:'external',no:'07', name:'External',             note:'reserves and the rupee',
   ids:['fxa','fca','gold','fwd3m','usdinr']},
  {id:'fiscal',  no:'08', name:'Fiscal & government paper', note:'who the government borrows from',
   ids:['tbill','rbicredit','rupeesec']}
];
let sortMode='theme';
function packSpans(n){
  const spans = new Array(n).fill(1);
  if(n % 2) spans[0] = 2;                 // odd group: headline tile spans both columns
  return spans;
}
function sparkline(vals, status, w=54, h=18){
  if(!vals || vals.length<2) return '';
  const [lo,hi]=[Math.min(...vals),Math.max(...vals)], span=(hi-lo)||1;
  const x=i=>(i/(vals.length-1))*w, y=v=>h-1.5-((v-lo)/span)*(h-3);
  const d=vals.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const col=C[status]||C.dim;
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <path d="${d}" fill="none" stroke="${col}" stroke-width="1.4"/>
    <circle cx="${x(vals.length-1).toFixed(1)}" cy="${y(vals[vals.length-1]).toFixed(1)}" r="2" fill="${col}"/></svg>`;
}
const STW = {good:['going well','st-g'], watch:['watch','st-w'], bad:['stress','st-b']};
function tileHTML(t, span){
  const [word,cls] = STW[t.status] || STW.watch;
  const delta = fmtDelta(t.change, t.unit);
  const longVal = String(fmtVal(t.value, t.unit)).length > 7;
  return `<div class="tile ${t.status}" data-id="${t.id}" data-status="${t.status}" style="grid-column:span ${span}"
       role="button" tabindex="0" title="${t.reason.replace(/"/g,'&quot;')}">
    <span class="edge"></span>
    <div class="t-head">
      <div class="t-label">${t.label}</div>
      <button class="histbtn" data-hist="${t.id}" title="History — which value prevailed on which date"
              aria-label="Value history of ${t.label}">&#8801;</button>
      <button class="help" data-def="${t.def_key}" data-deftitle="${t.label}"
              title="What is this?" aria-label="Definition of ${t.label}">?</button>
    </div>
    <div class="t-body">
      <div class="t-val${longVal?' wide':''}">${fmtVal(t.value,t.unit)}<small>${t.unit==='%'?'%':(t.unit==='x'?'x':(t.unit==='pp'?'pp':(t.unit==='₹'?'₹/US$':'')))}</small></div>
      <div class="t-side">
        ${t.stale ? `<span class="t-delta stale" title="No newer observation in the source table - ${t.stale_days} days before the newest data on this page">stale ${t.stale_days}d</span>`
          : (t.bp ? `<span class="t-delta ${t.bp<0?'up':'down'}" title="${t.bp<0?'cut':'hike'} of ${Math.abs(t.bp)}bp on ${t.effective_from}, from ${t.prev}%">${t.bp>0?'+':''}${t.bp}bp</span>`
          : (delta?`<span class="t-delta ${t.change>0?'up':'down'}">${delta}</span>`:''))}
        ${sparkline(t.spark, t.status)}
      </div>
    </div>
    <div class="t-foot"><span class="${cls}">${word}</span><span>${
      t.effective_from ? 'in force since ' + t.effective_from : t.period.slice(0,10)}${
      t.stale ? ' · last reported' : ''}</span></div>
  </div>`;
}
function renderTiles(){
  const byId=Object.fromEntries(T.map(t=>[t.id,t]));
  const order={bad:0, watch:1, good:2};
  document.getElementById('rail-groups').innerHTML = GROUPS.map(g=>{
    let ids=g.ids.filter(id=>byId[id]);
    if(sortMode==='worst') ids=[...ids].sort((a,b)=>order[byId[a].status]-order[byId[b].status]);
    const spans=packSpans(ids.length);
    return `<div class="sec"><span class="no">${g.no}</span><h2>${g.name}</h2><span class="note">${g.note}</span></div>
      <div class="tiles">${ids.map((id,i)=>tileHTML(byId[id], spans[i])).join('')}</div>`;
  }).join('');
  document.getElementById('rail-count').textContent =
    `${T.length} indicators · ${sortMode==='worst'?'worst first':'by theme'}`;
}

/* ---------- chart modal: full size, zoom + pan ---------- */
const modal=document.getElementById('modal');
let mState=null;
const MIN_WIN=6;
function drawModal(){
  if(!mState) return;
  const {cfg,n,pan}=mState;
  const body=document.getElementById('m-body');
  body.innerHTML='';
  const wrap=document.createElement('div');
  wrap.className='chartwrap';
  body.appendChild(wrap);
  drawChart(wrap, cfg, n, pan, 1400, 540);
  const shown = cfg.kind==='line' ? sliceWin(cfg.keys[0].key,n,pan) : sliceWin(cfg.barKey,n,pan);
  const d=shown.map(p=>p[0]);
  document.getElementById('m-window').textContent =
    `${d.length} pts shown${pan>0?` · ${pan} back`:''} · ${mState.max} stored`;
  document.getElementById('m-range').textContent =
    d.length ? `${d[0]} → ${d[d.length-1]}  ·  point value shown on hover` : '';
  document.getElementById('m-in').disabled = n <= MIN_WIN;
  document.getElementById('m-out').disabled = (n >= mState.max && pan === 0);
}
function openChartModal(cfg){
  const max=chartMaxLen(cfg);
  mState={cfg, max, n:Math.min(cfg.initial,max), pan:0, initial:Math.min(cfg.initial,max),
          lastFocus:document.activeElement};
  document.getElementById('m-title').textContent=cfg.title;
  document.getElementById('m-cap').textContent=cfg.cap;
  drawModal();
  modal.hidden=false; document.body.classList.add('modal-open');
  document.getElementById('m-close').focus();
}
function closeChartModal(){
  if(!modal.hidden){
    modal.hidden=true; document.body.classList.remove('modal-open');
    document.getElementById('m-body').innerHTML='';
    const back=mState && mState.lastFocus; mState=null;
    if(back && back.focus) back.focus();
  }
}
function zoomBy(f){ if(!mState) return;
  mState.n=Math.max(MIN_WIN, Math.min(mState.max, Math.round(mState.n*f)));
  mState.pan=Math.max(0, Math.min(mState.max-mState.n, mState.pan)); drawModal(); }
function panBy(p){ if(!mState) return;
  mState.pan=Math.max(0, Math.min(mState.max-mState.n, mState.pan+p)); drawModal(); }
document.getElementById('m-in').addEventListener('click', e=>{e.stopPropagation(); zoomBy(1/1.6);});
document.getElementById('m-out').addEventListener('click', e=>{e.stopPropagation(); zoomBy(1.6);});
document.getElementById('m-reset').addEventListener('click', e=>{
  e.stopPropagation(); if(!mState) return; mState.n=mState.initial; mState.pan=0; drawModal(); });
document.getElementById('m-close').addEventListener('click', e=>{e.stopPropagation(); closeChartModal();});
modal.addEventListener('click', e=>{ if(e.target===modal) closeChartModal(); });
modal.addEventListener('wheel', e=>{ if(!modal.hidden){ e.preventDefault(); zoomBy(e.deltaY>0?1.25:1/1.25);} }, {passive:false});
(function(){
  let dragging=false, startX=0, startPan=0;
  modal.addEventListener('pointerdown', e=>{
    if(modal.hidden || !e.target.closest('#m-body')) return;
    dragging=true; startX=e.clientX; startPan=mState.pan;
    const s=document.querySelector('#m-body svg'); if(s) s.classList.add('dragging');
  });
  modal.addEventListener('pointermove', e=>{
    if(!dragging || !mState) return;
    const w=Math.max(1, document.getElementById('m-body').clientWidth);
    const perPx=mState.n/w*1.5;
    panBy(Math.round((startX-e.clientX)*perPx) + startPan - mState.pan);
  });
  const stop=()=>{ dragging=false; const s=document.querySelector('#m-body svg'); if(s) s.classList.remove('dragging'); };
  modal.addEventListener('pointerup', stop);
  modal.addEventListener('pointercancel', stop);
})();

/* ---------- history modal: which value prevailed on which date ----------
   SETTINGS (CRR, SLR, the repo rate) show their change log: the rate, the date it took effect, the date
   it was superseded and the size of the move. READINGS show the last 20 published observations with the
   step from the previous one. Both tables are built from rows computed at build time. */
const histModal=document.getElementById('histmodal');
let hLastFocus=null;
function fmtHistVal(v, unit){
  if(v===null||v===undefined) return '—';
  if(unit==='%') return v.toFixed(2)+'%';
  if(unit==='₹ crore') return Math.round(v).toLocaleString('en-IN');
  if(unit==='₹') return v.toFixed(2);
  if(unit==='x') return v.toFixed(2)+'x';
  if(unit==='pp') return (v>0?'+':'')+v.toFixed(2)+'pp';
  return String(v);
}
function openHist(t){
  if(!t) return;
  hLastFocus=document.activeElement;
  const rows=t.history||[];
  const isSet=t.history_kind==='setting';
  const unit=t.unit;
  document.getElementById('h-title').textContent=t.label;
  document.getElementById('h-sub').textContent =
    (isSet ? 'Policy setting — the rate in force on each date'
           : 'Published observations — the value on each date')
    + ` · ${unit} · ${t.history_note||''}`;
  let html='';
  if(isSet){
    const cur=t.effective_from||rows[0].date;
    html+=`<div class="hist-sum">In force now: <b>${fmtHistVal(t.value,unit)}</b> since <b>${cur}</b>`
        + (t.prev!=null?` · previous setting ${fmtHistVal(t.prev,unit)} (${t.bp>0?'+':''}${t.bp}bp)`:'')
        + `</div>`;
    html+=`<table class="hist"><thead><tr><th>In force from</th><th>Rate</th><th>Until</th><th>Move</th></tr></thead><tbody>`;
    rows.forEach((r,i)=>{
      const until = i===0 ? 'in force now' : rows[i-1].date;
      const mv = (r.change===null||r.change===undefined) ? '—' : `${r.change>0?'+':''}${r.change}bp`;
      html+=`<tr class="${i===0?'now':''}"><td class="d">${r.date}</td><td class="v">${fmtHistVal(r.value,unit)}</td>`
          + `<td class="d">${until}</td><td class="c">${mv}</td></tr>`;
    });
    html+='</tbody></table>';
  } else {
    html+=`<div class="hist-sum">Latest: <b>${fmtHistVal(t.value,unit)}</b> as at <b>${t.period.slice(0,10)}</b>`
        + (t.change!=null?` · change vs previous reading ${t.change>0?'+':''}${fmtHistVal(t.change,unit)}`:'')
        + `</div>`;
    html+=`<table class="hist"><thead><tr><th>Date</th><th>Value</th><th>Change vs previous</th></tr></thead><tbody>`;
    rows.forEach((r,i)=>{
      const mv = (r.change===null||r.change===undefined) ? '—'
               : ((r.change>0?'+':'') + fmtHistVal(r.change,unit));
      html+=`<tr class="${i===0?'now':''}"><td class="d">${r.date}</td><td class="v">${fmtHistVal(r.value,unit)}</td>`
          + `<td class="c ${r.change>0?'up':(r.change<0?'down':'')}">${mv}</td></tr>`;
    });
    html+='</tbody></table>';
  }
  html+=`<div class="hist-note">Source: ${(S[t.series_key]||{}).source||'RBI DBIE'} · values as published · `
      + `${t.history_note||''}</div>`;
  document.getElementById('h-body').innerHTML=html;
  histModal.hidden=false; document.body.classList.add('modal-open');
  document.getElementById('h-close').focus();
}
function closeHist(){
  if(!histModal.hidden){
    histModal.hidden=true;
    if(modal.hidden && defModal.hidden) document.body.classList.remove('modal-open');
    if(hLastFocus && hLastFocus.focus) hLastFocus.focus();
    hLastFocus=null;
  }
}
document.getElementById('h-close').addEventListener('click', e=>{e.stopPropagation(); closeHist();});
histModal.addEventListener('click', e=>{ if(e.target===histModal) closeHist(); });
/* a whole TILE opens its history (the &#8801; does the same); ? still opens the definition */
document.addEventListener('click', e=>{
  const b=e.target.closest('.histbtn');
  if(b){ e.stopPropagation(); openHist(T.find(x=>x.id===b.dataset.hist)); return; }
  if(e.target.closest('.help')) return;

}, true);
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter' && e.key!==' ') return;
  const tile=e.target.closest && e.target.closest('.tile');

/* ---------- definition modal ---------- */
const defModal=document.getElementById('defmodal');
let defLastFocus=null;
function defBlock(key){
  const d=DEF[key];
  if(!d){
    return `<h4>${key.replace(/_/g,' ')}</h4>
      <div class="pending">Definition pending. This build has no sourced wording for “${key}”. Definitions are
      carried from RBI / MoSPI / FBIL pages and stored in definitions.json — nothing is written from memory.</div>`;
  }
  return `<h4>${d.term||key}</h4><p>${d.definition||''}</p>
    <div class="src">Source: ${d.source_name||'—'}${d.source_url?` · <a href="${d.source_url}" target="_blank" rel="noopener">${d.source_url}</a>`:''}</div>`;
}
function openDef(keys, title, extra){
  defLastFocus=document.activeElement;
  document.getElementById('d-title').textContent=title||'Definition';
  document.getElementById('d-sub').textContent='Official definition · published by the Reserve Bank of India or a Government of India agency';
  let html=keys.map(defBlock).join('');
  if(extra && extra.tile){
    const t=extra.tile;
    const unit = t.unit==='₹ crore' ? ' cr' : (t.unit==='%' ? '%' : (t.unit==='x' ? 'x' : (t.unit==='pp' ? ' pp' : '')));
    const val = fmtVal(t.value,t.unit) + unit;
    /* A policy SETTING is dated by when it took effect. "latest reading 3.00% for 2026-10-02" was
       nonsense for CRR: nothing has happened to CRR since Dec-2025; 2026-10-02 is just the newest
       weekly row repeating it. */
    const reading = t.effective_from
      ? `<b>${val}</b> — in force since ${t.effective_from}${t.prev!=null?` (previous setting ${t.prev}${unit})`:''}
         · newest published row repeating it: ${t.period.slice(0,10)}`
      : `<b>${val}</b> — as at ${t.period.slice(0,10)}${t.stale?` (no newer observation in the source table)`:''}`;
    // drop a leading repeat of the value from the reason ("4.82% - inside the band" -> "inside the band")
    const lead = new RegExp('^' + val.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\s*[-–—]\\s*');
    const why = String(t.reason||'').replace(lead,'');
    html+=`<div class="meta"><b>On this dashboard:</b> ${reading}<br><br>${why?`<b>Why this colour:</b> ${why}<br><br>`:''}<b>Scoring rule:</b> ${t.rule}</div>`;
  }
  if(extra && extra.chart){
    html+=`<div class="meta"><b>What the chart shows:</b> ${extra.chart.cap}<br><br>
      <b>Series plotted:</b> ${extra.chart.legend.map(l=>l[0]).join(', ')} ·
      hover any point to read the exact value for that date; click the chart to open it full size with zoom.<br><br>
      <b>Source table:</b> ${extra.chart.sources||'RBI Database on Indian Economy (DBIE) weekly/fortnightly statements'}.</div>`;
  }
  document.getElementById('d-body').innerHTML=html;
  defModal.hidden=false; document.body.classList.add('modal-open');
  document.getElementById('d-close').focus();
}
function closeDef(){
  if(!defModal.hidden){
    defModal.hidden=true; document.body.classList.remove('modal-open');
    if(defLastFocus && defLastFocus.focus) defLastFocus.focus();
    defLastFocus=null;
  }
}
document.getElementById('d-close').addEventListener('click', e=>{e.stopPropagation(); closeDef();});
defModal.addEventListener('click', e=>{ if(e.target===defModal) closeDef(); });
document.addEventListener('click', e=>{
  const b=e.target.closest('.help'); if(!b) return;
  e.stopPropagation(); e.preventDefault();
  const keys=(b.dataset.defkeys||b.dataset.def||'').split(',').filter(Boolean);
  const key=keys[0];

  openDef(keys, b.dataset.deftitle || (tile && tile.label) || 'Definition',
          tile ? {tile} : {chart:CHARTS.find(c=>c.defKeys[0]===key)});

document.addEventListener('keydown', e=>{
